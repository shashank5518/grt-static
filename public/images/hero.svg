<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Growth Realtech — real estate hero background">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152243"/>
    </linearGradient>
    <radialGradient id="r" cx="20%" cy="20%" r="70%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <circle cx="260" cy="180" r="420" fill="url(#r)" filter="url(#soft)"/>
  <circle cx="1380" cy="220" r="360" fill="#ffffff" opacity="0.06" filter="url(#soft)"/>
  <circle cx="1250" cy="760" r="420" fill="#2f6bff" opacity="0.10" filter="url(#soft)"/>

  <!-- Minimal skyline -->
  <g opacity="0.16" fill="#ffffff">
    <rect x="180" y="520" width="110" height="240" rx="12"/>
    <rect x="320" y="460" width="140" height="300" rx="12"/>
    <rect x="500" y="560" width="120" height="200" rx="12"/>
    <rect x="660" y="420" width="180" height="340" rx="12"/>
    <rect x="880" y="520" width="140" height="240" rx="12"/>
    <rect x="1050" y="470" width="160" height="290" rx="12"/>
    <rect x="1240" y="560" width="180" height="200" rx="12"/>
  </g>
  <rect y="760" width="1600" height="140" fill="#000000" opacity="0.12"/>
  <text x="72" y="848" fill="#ffffff" fill-opacity="0.42" font-family="system-ui, Segoe UI, sans-serif" font-size="26" font-weight="700">Growth Realtech</text>
  <text x="72" y="882" fill="#ffffff" fill-opacity="0.28" font-family="system-ui, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="0.35em">GRT</text>
</svg>

